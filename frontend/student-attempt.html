<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Attempt Exam</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="assets/css/styles.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
      <div class="container">
        <a class="navbar-brand" href="student-exams.html">Online Exam</a>
        <div class="ms-auto d-flex align-items-center gap-2">
          <span id="studentName" class="text-muted small"></span>
          <button id="logoutBtn" class="btn btn-sm btn-outline-secondary">Logout</button>
        </div>
      </div>
    </nav>

    <div class="container py-4">
      <div id="errorBox" class="alert alert-danger d-none"></div>

      <div class="d-flex align-items-center justify-content-between mb-3">
        <div>
          <h4 id="examTitle" class="mb-1">Exam</h4>
          <div id="examMeta" class="text-muted small"></div>
        </div>
        <div class="text-end">
          <div class="small text-muted">Time Left</div>
          <div id="timerText" class="fw-semibold text-danger">--:--</div>
          <button id="submitBtn" class="btn btn-success mt-2">Submit</button>
        </div>
      </div>

      <div id="loading" class="text-muted">Loading questions...</div>
      <div id="questions" class="d-none"></div>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/storage.js"></script>
    <script>
      const student = window.StorageUtil.getJson("student");
      if (!student) window.location.href = "student-login.html";

      document.getElementById("studentName").textContent = student.full_name;
      document.getElementById("logoutBtn").addEventListener("click", () => {
        window.Api.apiPost("/api/auth/student/logout", {}).finally(() => {
          window.StorageUtil.clearKey("student");
          window.location.href = "index.html";
        });
      });

      const params = new URLSearchParams(window.location.search);
      const attemptId = Number(params.get("attempt_id"));
      const examId = Number(params.get("exam_id"));

      const errorBox = document.getElementById("errorBox");
      const loading = document.getElementById("loading");
      const questionsEl = document.getElementById("questions");
      const submitBtn = document.getElementById("submitBtn");
      const timerText = document.getElementById("timerText");
      let timerInterval = null;
      let timedOut = false;
      let remainingSeconds = 0;

      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.classList.remove("d-none");
      }

      async function autoSubmitOnTimeout() {
        if (timedOut) return;
        timedOut = true;
        clearInterval(timerInterval);
        timerText.textContent = "00:00";
        submitBtn.disabled = true;
        try {
          const data = await window.Api.apiPost(`/api/submit-exam`, { attempt_id: attemptId });
          window.StorageUtil.setJson("lastResult", data.result);
          window.location.href = `student-result.html?attempt_id=${attemptId}`;
        } catch (err) {
          showError(err.message || "Time over. Please open result page.");
        }
      }

      function renderTimer() {
        const mm = String(Math.floor(remainingSeconds / 60)).padStart(2, "0");
        const ss = String(remainingSeconds % 60).padStart(2, "0");
        timerText.textContent = `${mm}:${ss}`;
      }

      function startCountdownFromSeconds(seconds) {
        remainingSeconds = Math.max(0, Number(seconds) || 0);
        renderTimer();
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
          if (remainingSeconds <= 0) {
            autoSubmitOnTimeout();
            return;
          }
          remainingSeconds -= 1;
          renderTimer();
        }, 1000);
      }

      async function syncTimerFromServer() {
        const data = await window.Api.apiGet(`/api/attempts/${attemptId}/timer`);
        if (data.status === "SUBMITTED" || data.expired || data.remaining_seconds <= 0) {
          autoSubmitOnTimeout();
          return;
        }
        startCountdownFromSeconds(data.remaining_seconds);
      }

      function questionCard(q) {
        const wrapper = document.createElement("div");
        wrapper.className = "card p-3 mb-3";
        wrapper.innerHTML = `
          <div class="d-flex justify-content-between">
            <div class="fw-semibold">${q.question_text}</div>
            <div class="text-muted small">${q.marks} marks</div>
          </div>
          <hr class="my-2" />
          <div class="form-check">
            <input class="form-check-input" type="radio" name="q_${q.question_id}" id="q_${q.question_id}_A" value="A">
            <label class="form-check-label" for="q_${q.question_id}_A">A) ${q.option_a}</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="q_${q.question_id}" id="q_${q.question_id}_B" value="B">
            <label class="form-check-label" for="q_${q.question_id}_B">B) ${q.option_b}</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="q_${q.question_id}" id="q_${q.question_id}_C" value="C">
            <label class="form-check-label" for="q_${q.question_id}_C">C) ${q.option_c}</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="q_${q.question_id}" id="q_${q.question_id}_D" value="D">
            <label class="form-check-label" for="q_${q.question_id}_D">D) ${q.option_d}</label>
          </div>
          <div class="mt-2">
            <button class="btn btn-sm btn-outline-primary" data-save="${q.question_id}">Save Answer</button>
            <span class="text-muted small ms-2" id="saved_${q.question_id}"></span>
          </div>
        `;
        return wrapper;
      }

      function getSelectedOption(questionId) {
        const radios = document.querySelectorAll(`input[name="q_${questionId}"]`);
        for (const r of radios) if (r.checked) return r.value;
        return null;
      }

      async function loadExamAndQuestions() {
        if (!Number.isInteger(attemptId) || !Number.isInteger(examId)) {
          loading.classList.add("d-none");
          showError("Invalid attempt_id or exam_id");
          return;
        }

        try {
          const data = await window.Api.apiGet(`/api/exams/${examId}`);
          document.getElementById("examTitle").textContent = data.exam.exam_title;
          document.getElementById("examMeta").textContent =
            `${data.exam.subject_name || ""} • ${data.exam.duration_minutes} minutes • Attempt ID: ${attemptId}`;

          questionsEl.innerHTML = "";
          data.questions.forEach((q) => questionsEl.appendChild(questionCard(q)));

          loading.classList.add("d-none");
          questionsEl.classList.remove("d-none");

          questionsEl.addEventListener("click", async (e) => {
            const btn = e.target.closest("button[data-save]");
            if (!btn) return;
            const qid = Number(btn.getAttribute("data-save"));
            const selected = getSelectedOption(qid);
            if (!selected) {
              showError("Please select an option first.");
              return;
            }
            errorBox.classList.add("d-none");

            btn.disabled = true;
            try {
              await window.Api.apiPost(`/api/submit-answer`, {
                attempt_id: attemptId,
                question_id: qid,
                selected_option: selected
              });
              document.getElementById(`saved_${qid}`).textContent = "Saved";
            } catch (err) {
              showError(err.message);
            } finally {
              btn.disabled = false;
            }
          });
        } catch (err) {
          loading.classList.add("d-none");
          showError(err.message);
        }
      }

      submitBtn.addEventListener("click", async () => {
        errorBox.classList.add("d-none");
        submitBtn.disabled = true;

        try {
          const data = await window.Api.apiPost(`/api/submit-exam`, { attempt_id: attemptId });
          window.StorageUtil.setJson("lastResult", data.result);
          window.location.href = `student-result.html?attempt_id=${attemptId}`;
        } catch (err) {
          showError(err.message);
          submitBtn.disabled = false;
        }
      });

      loadExamAndQuestions();
      syncTimerFromServer().catch((err) => showError(err.message));
    </script>
  </body>
</html>
