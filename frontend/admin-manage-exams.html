<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manage Exams</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="assets/css/styles.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
      <div class="container">
        <a class="navbar-brand" href="admin-dashboard.html">Admin</a>
        <div class="ms-auto">
          <button id="logoutBtn" class="btn btn-sm btn-outline-secondary">Logout</button>
        </div>
      </div>
    </nav>

    <div class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Manage Exams</h4>
        <div class="d-flex gap-2">
          <a class="btn btn-sm btn-primary" href="admin-create-exam.html">Create Exam</a>
          <a class="btn btn-sm btn-outline-secondary" href="admin-dashboard.html">Back</a>
        </div>
      </div>

      <div id="errorBox" class="alert alert-danger d-none"></div>
      <div id="successBox" class="alert alert-success d-none"></div>
      <div id="loading" class="text-muted">Loading exams...</div>

      <div id="content" class="d-none">
        <div class="card p-3">
          <div class="table-responsive">
            <table class="table table-striped table-bordered bg-white mb-0">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Title</th>
                  <th>Subject</th>
                  <th>Time Limit</th>
                  <th>Marks</th>
                  <th>Questions</th>
                  <th>Attempts</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Edit Exam</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form id="editForm">
              <input type="hidden" id="editExamId" />
              <div class="mb-3">
                <label class="form-label">Exam Title</label>
                <input id="editTitle" class="form-control" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Subject</label>
                <input id="editSubject" class="form-control" />
              </div>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Duration (minutes)</label>
                  <input id="editDuration" type="number" min="1" class="form-control" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Total Marks</label>
                  <input id="editMarks" type="number" min="1" class="form-control" required />
                </div>
              </div>
              <button class="btn btn-primary w-100 mt-2" type="submit">Save Changes</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/storage.js"></script>
    <script>
      const admin = window.StorageUtil.getJson("admin");
      if (!admin) window.location.href = "admin-login.html";

      const errorBox = document.getElementById("errorBox");
      const successBox = document.getElementById("successBox");
      const loading = document.getElementById("loading");
      const content = document.getElementById("content");
      const rows = document.getElementById("rows");
      const editModal = new bootstrap.Modal(document.getElementById("editModal"));

      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.classList.remove("d-none");
        successBox.classList.add("d-none");
      }

      function showSuccess(msg) {
        successBox.textContent = msg;
        successBox.classList.remove("d-none");
        errorBox.classList.add("d-none");
      }

      document.getElementById("logoutBtn").addEventListener("click", () => {
        window.Api.apiPost("/api/auth/admin/logout", {}).finally(() => {
          window.StorageUtil.clearKey("admin");
          window.location.href = "index.html";
        });
      });

      function renderRows(exams) {
        rows.innerHTML = "";
        exams.forEach((e) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${e.exam_id}</td>
            <td>${e.exam_title}</td>
            <td>${e.subject_name || ""}</td>
            <td>${e.duration_minutes} min</td>
            <td>${e.total_marks}</td>
            <td>${e.question_count ?? 0}</td>
            <td>${e.attempt_count ?? 0}</td>
            <td class="d-flex gap-2">
              <button class="btn btn-sm btn-outline-primary" data-edit="${e.exam_id}">Edit</button>
              <button class="btn btn-sm btn-outline-danger" data-delete="${e.exam_id}">Delete</button>
            </td>
          `;
          tr.dataset.exam = JSON.stringify(e);
          rows.appendChild(tr);
        });
      }

      async function loadExams() {
        try {
          const data = await window.Api.apiGet("/api/admin/exams");
          renderRows(data.exams || []);
          loading.classList.add("d-none");
          content.classList.remove("d-none");
        } catch (err) {
          loading.classList.add("d-none");
          showError(err.message);
        }
      }

      rows.addEventListener("click", async (e) => {
        const editBtn = e.target.closest("button[data-edit]");
        const deleteBtn = e.target.closest("button[data-delete]");

        if (editBtn) {
          const tr = editBtn.closest("tr");
          const exam = JSON.parse(tr.dataset.exam);
          document.getElementById("editExamId").value = exam.exam_id;
          document.getElementById("editTitle").value = exam.exam_title;
          document.getElementById("editSubject").value = exam.subject_name || "";
          document.getElementById("editDuration").value = exam.duration_minutes;
          document.getElementById("editMarks").value = exam.total_marks;
          editModal.show();
          return;
        }

        if (deleteBtn) {
          const examId = Number(deleteBtn.getAttribute("data-delete"));
          if (!confirm(`Delete exam #${examId}? This removes questions and attempts.`)) return;

          try {
            await window.Api.apiDelete(`/api/admin/exams/${examId}`);
            showSuccess(`Exam #${examId} deleted.`);
            await loadExams();
          } catch (err) {
            showError(err.message);
          }
        }
      });

      document.getElementById("editForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const examId = Number(document.getElementById("editExamId").value);

        try {
          await window.Api.apiPut(`/api/admin/exams/${examId}`, {
            exam_title: document.getElementById("editTitle").value.trim(),
            subject_name: document.getElementById("editSubject").value.trim(),
            duration_minutes: Number(document.getElementById("editDuration").value),
            total_marks: Number(document.getElementById("editMarks").value)
          });
          editModal.hide();
          showSuccess("Exam updated.");
          await loadExams();
        } catch (err) {
          showError(err.message);
        }
      });

      loadExams();
    </script>
  </body>
</html>
