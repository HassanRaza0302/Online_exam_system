<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Exam Results</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="assets/css/styles.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
      <div class="container">
        <a class="navbar-brand" href="admin-dashboard.html">Admin</a>
        <div class="ms-auto d-flex align-items-center gap-2">
          <button id="logoutBtn" class="btn btn-sm btn-outline-secondary">Logout</button>
        </div>
      </div>
    </nav>

    <div class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Results & Rankings</h4>
        <a class="btn btn-sm btn-outline-secondary" href="admin-dashboard.html">Back</a>
      </div>

      <div class="card p-3 mb-3">
        <div class="row g-2 align-items-end">
          <div class="col-md-6">
            <label class="form-label">Select Exam</label>
            <select id="examSelect" class="form-select"></select>
          </div>
          <div class="col-md-6 d-flex gap-2">
            <button id="loadBtn" class="btn btn-primary">Load Results</button>
            <button id="recalcBtn" class="btn btn-outline-primary">Recalculate Ranking</button>
          </div>
        </div>
      </div>

      <div id="errorBox" class="alert alert-danger d-none"></div>
      <div id="loading" class="text-muted d-none">Loading...</div>

      <div class="table-responsive">
        <table class="table table-striped table-bordered bg-white">
          <thead>
            <tr>
              <th>Rank</th>
              <th>Student</th>
              <th>Email</th>
              <th>Score</th>
              <th>%</th>
              <th>Submitted</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/storage.js"></script>
    <script>
      const admin = window.StorageUtil.getJson("admin");
      if (!admin) window.location.href = "admin-login.html";

      document.getElementById("logoutBtn").addEventListener("click", () => {
        window.Api.apiPost("/api/auth/admin/logout", {}).finally(() => {
          window.StorageUtil.clearKey("admin");
          window.location.href = "index.html";
        });
      });

      const examSelect = document.getElementById("examSelect");
      const rows = document.getElementById("rows");
      const errorBox = document.getElementById("errorBox");
      const loading = document.getElementById("loading");

      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.classList.remove("d-none");
      }

      function setLoading(on) {
        loading.classList.toggle("d-none", !on);
      }

      async function loadExams() {
        try {
          const data = await window.Api.apiGet("/api/exams");
          const exams = data.exams || [];
          examSelect.innerHTML = exams
            .map((e) => `<option value="${e.exam_id}">${e.exam_id} - ${e.exam_title}</option>`)
            .join("");
        } catch (err) {
          showError(err.message);
        }
      }

      function renderResults(items) {
        rows.innerHTML = "";
        (items || []).forEach((r) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${r.student_rank ?? ""}</td>
            <td>${r.full_name}</td>
            <td>${r.email}</td>
            <td>${r.score}</td>
            <td>${r.percentage}</td>
            <td>${new Date(r.submitted_at).toLocaleString()}</td>
          `;
          rows.appendChild(tr);
        });
      }

      document.getElementById("loadBtn").addEventListener("click", async () => {
        errorBox.classList.add("d-none");
        setLoading(true);
        try {
          const examId = Number(examSelect.value);
          const data = await window.Api.apiGet(`/api/admin/exams/${examId}/results`);
          renderResults(data.results);
        } catch (err) {
          showError(err.message);
        } finally {
          setLoading(false);
        }
      });

      document.getElementById("recalcBtn").addEventListener("click", async () => {
        errorBox.classList.add("d-none");
        setLoading(true);
        try {
          const examId = Number(examSelect.value);
          await window.Api.apiPost(`/api/admin/exams/${examId}/rankings/recalculate`, {});
          const data = await window.Api.apiGet(`/api/admin/exams/${examId}/results`);
          renderResults(data.results);
        } catch (err) {
          showError(err.message);
        } finally {
          setLoading(false);
        }
      });

      loadExams();
    </script>
  </body>
</html>
