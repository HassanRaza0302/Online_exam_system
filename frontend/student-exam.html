<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Start Exam</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="assets/css/styles.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
      <div class="container">
        <a class="navbar-brand" href="student-exams.html">Online Exam</a>
        <div class="ms-auto d-flex align-items-center gap-2">
          <span id="studentName" class="text-muted small"></span>
          <button id="logoutBtn" class="btn btn-sm btn-outline-secondary">Logout</button>
        </div>
      </div>
    </nav>

    <div class="container py-4">
      <div id="errorBox" class="alert alert-danger d-none"></div>

      <div id="loading" class="text-muted">Loading exam...</div>

      <div id="content" class="d-none">
        <div class="card p-4">
          <h4 id="examTitle" class="mb-1"></h4>
          <div id="examMeta" class="text-muted small mb-3"></div>

          <div class="d-flex gap-2">
            <button id="startBtn" class="btn btn-primary">Start Exam</button>
            <a class="btn btn-outline-secondary" href="student-exams.html">Back</a>
          </div>
        </div>
      </div>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/exam-security.js"></script>
    <script>
      const student = window.StorageUtil.getJson("student");
      if (!student) window.location.href = "student-login.html";

      document.getElementById("studentName").textContent = student.full_name;
      document.getElementById("logoutBtn").addEventListener("click", () => {
        window.Api.apiPost("/api/auth/student/logout", {}).finally(() => {
          window.StorageUtil.clearKey("student");
          window.location.href = "index.html";
        });
      });

      const params = new URLSearchParams(window.location.search);
      const examId = Number(params.get("exam_id"));

      const errorBox = document.getElementById("errorBox");
      const loading = document.getElementById("loading");
      const content = document.getElementById("content");
      const startBtn = document.getElementById("startBtn");

      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.classList.remove("d-none");
      }

      async function loadExam() {
        if (!Number.isInteger(examId)) {
          loading.classList.add("d-none");
          showError("Invalid exam_id");
          return;
        }

        try {
          const data = await window.Api.apiGet(`/api/exams/${examId}`);
          document.getElementById("examTitle").textContent = data.exam.exam_title;
          document.getElementById("examMeta").textContent =
            `${data.exam.subject_name || ""} • ${data.exam.duration_minutes} minutes • Total marks: ${data.exam.total_marks}`;

          loading.classList.add("d-none");
          content.classList.remove("d-none");
        } catch (err) {
          loading.classList.add("d-none");
          showError(err.message);
        }
      }

      startBtn.addEventListener("click", async () => {
        startBtn.disabled = true;
        errorBox.classList.add("d-none");
        try {
          // student_id is taken from session on backend
          const data = await window.Api.apiPost(`/api/start-exam`, { exam_id: examId });
          window.StorageUtil.setJson("currentAttempt", {
            attempt_id: data.attempt_id,
            exam_id: examId,
            expires_at: data.expires_at
          });
          window.location.href = `student-attempt.html?attempt_id=${data.attempt_id}&exam_id=${examId}&expires_at=${encodeURIComponent(
            data.expires_at
          )}`;
        } catch (err) {
          startBtn.disabled = false;
          showError(err.message);
        }
      });

      loadExam();
    </script>
  </body>
</html>
