<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add Questions</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="assets/css/styles.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
      <div class="container">
        <a class="navbar-brand" href="admin-dashboard.html">Admin</a>
        <div class="ms-auto d-flex align-items-center gap-2">
          <button id="logoutBtn" class="btn btn-sm btn-outline-secondary">Logout</button>
        </div>
      </div>
    </nav>

    <div class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Add Questions</h4>
        <a class="btn btn-sm btn-outline-secondary" href="admin-dashboard.html">Back</a>
      </div>

      <div class="row g-3">
        <div class="col-lg-4">
          <div class="card p-3">
            <h6 class="mb-2">Select Exam</h6>
            <div id="errorBox" class="alert alert-danger d-none"></div>
            <select id="examSelect" class="form-select mb-2"></select>
            <button id="refreshBtn" class="btn btn-sm btn-outline-primary">Refresh</button>
          </div>
        </div>

        <div class="col-lg-8">
          <div class="card p-4">
            <h6 class="mb-3">New Question</h6>

            <div id="successBox" class="alert alert-success d-none"></div>

            <form id="qForm">
              <div class="mb-3">
                <label class="form-label">Question Text</label>
                <textarea id="questionText" class="form-control" rows="3" required></textarea>
              </div>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Option A</label>
                  <input id="a" class="form-control" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Option B</label>
                  <input id="b" class="form-control" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Option C</label>
                  <input id="c" class="form-control" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Option D</label>
                  <input id="d" class="form-control" required />
                </div>
              </div>

              <div class="row g-3 mt-1">
                <div class="col-md-6">
                  <label class="form-label">Correct Option</label>
                  <select id="correct" class="form-select" required>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                    <option value="D">D</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Marks</label>
                  <input id="marks" type="number" class="form-control" value="5" min="1" required />
                </div>
              </div>

              <button class="btn btn-primary w-100 mt-3" type="submit">Add Question</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/storage.js"></script>
    <script>
      const admin = window.StorageUtil.getJson("admin");
      if (!admin) window.location.href = "admin-login.html";

      document.getElementById("logoutBtn").addEventListener("click", () => {
        window.Api.apiPost("/api/auth/admin/logout", {}).finally(() => {
          window.StorageUtil.clearKey("admin");
          window.location.href = "index.html";
        });
      });

      const examSelect = document.getElementById("examSelect");
      const errorBox = document.getElementById("errorBox");
      const successBox = document.getElementById("successBox");

      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.classList.remove("d-none");
      }
      function showSuccess(msg) {
        successBox.textContent = msg;
        successBox.classList.remove("d-none");
      }

      async function loadExams() {
        errorBox.classList.add("d-none");
        try {
          const data = await window.Api.apiGet("/api/exams");
          const exams = data.exams || [];
          examSelect.innerHTML = exams
            .map((e) => `<option value="${e.exam_id}">${e.exam_id} - ${e.exam_title}</option>`)
            .join("");
        } catch (err) {
          showError(err.message);
        }
      }

      document.getElementById("refreshBtn").addEventListener("click", loadExams);

      document.getElementById("qForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        errorBox.classList.add("d-none");
        successBox.classList.add("d-none");

        const examId = Number(examSelect.value);
        try {
          const payload = {
            question_text: document.getElementById("questionText").value,
            option_a: document.getElementById("a").value,
            option_b: document.getElementById("b").value,
            option_c: document.getElementById("c").value,
            option_d: document.getElementById("d").value,
            correct_option: document.getElementById("correct").value,
            marks: Number(document.getElementById("marks").value)
          };

          const data = await window.Api.apiPost(`/api/admin/exams/${examId}/questions`, payload);
          showSuccess(`Question added. New question_id: ${data.question_id}`);
          e.target.reset();
          document.getElementById("marks").value = 5;
          document.getElementById("correct").value = "A";
        } catch (err) {
          showError(err.message);
        }
      });

      loadExams();
    </script>
  </body>
</html>
