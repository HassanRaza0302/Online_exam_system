<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ranking</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="assets/css/styles.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
      <div class="container">
        <a class="navbar-brand" href="student-exams.html">Online Exam</a>
      </div>
    </nav>

    <div class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Exam Ranking</h4>
        <a class="btn btn-sm btn-outline-primary" href="student-exams.html">Back</a>
      </div>

      <div id="errorBox" class="alert alert-danger d-none"></div>
      <div id="loading" class="text-muted">Loading ranking...</div>

      <div class="table-responsive">
        <table class="table table-striped table-bordered bg-white">
          <thead>
            <tr>
              <th>Rank</th>
              <th>Student</th>
              <th>Score</th>
              <th>Percentage</th>
              <th>Submitted</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/storage.js"></script>
    <script>
      const student = window.StorageUtil.getJson("student");
      if (!student) window.location.href = "student-login.html";

      const params = new URLSearchParams(window.location.search);
      const examId = Number(params.get("exam_id"));

      const errorBox = document.getElementById("errorBox");
      const loading = document.getElementById("loading");
      const rows = document.getElementById("rows");

      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.classList.remove("d-none");
      }

      async function loadRanking() {
        if (!Number.isInteger(examId)) {
          loading.classList.add("d-none");
          showError("exam_id is required.");
          return;
        }
        try {
          const data = await window.Api.apiGet(`/api/ranking?exam_id=${examId}`);
          rows.innerHTML = "";
          (data.ranking || []).forEach((r) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td>${r.student_rank ?? "-"}</td>
              <td>${r.full_name}</td>
              <td>${r.score}</td>
              <td>${r.percentage}</td>
              <td>${new Date(r.submitted_at).toLocaleString()}</td>
            `;
            rows.appendChild(tr);
          });
          loading.classList.add("d-none");
        } catch (err) {
          loading.classList.add("d-none");
          showError(err.message);
        }
      }

      loadRanking();
    </script>
  </body>
</html>
