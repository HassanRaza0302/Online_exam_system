<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Student Exams</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="assets/css/styles.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
      <div class="container">
        <a class="navbar-brand" href="index.html">Online Exam</a>
        <div class="ms-auto d-flex align-items-center gap-2">
          <span id="studentName" class="text-muted small"></span>
          <button id="logoutBtn" class="btn btn-sm btn-outline-secondary">Logout</button>
        </div>
      </div>
    </nav>

    <div class="container py-4">
      <div class="d-flex align-items-center justify-content-between mb-3">
        <h4 class="mb-0">Available Exams</h4>
        <div class="d-flex gap-2">
          <a class="btn btn-sm btn-outline-secondary" href="student-profile.html">Profile</a>
          <button id="refreshBtn" class="btn btn-sm btn-outline-primary">Refresh</button>
        </div>
      </div>

      <div id="errorBox" class="alert alert-danger d-none"></div>
      <div id="loading" class="text-muted">Loading exams...</div>

      <div id="examsList" class="row g-3 mt-1"></div>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/storage.js"></script>
    <script>
      const student = window.StorageUtil.getJson("student");
      if (!student) window.location.href = "student-login.html";

      document.getElementById("studentName").textContent = student ? student.full_name : "";

      document.getElementById("logoutBtn").addEventListener("click", () => {
        window.Api.apiPost("/api/auth/student/logout", {}).finally(() => {
          window.StorageUtil.clearKey("student");
          window.location.href = "index.html";
        });
      });

      const errorBox = document.getElementById("errorBox");
      const loading = document.getElementById("loading");
      const list = document.getElementById("examsList");

      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.classList.remove("d-none");
      }

      function examCard(exam) {
        const col = document.createElement("div");
        col.className = "col-12 col-md-6 col-lg-4";
        col.innerHTML = `
          <div class="card p-3 h-100">
            <h5 class="mb-1">${exam.exam_title}</h5>
            <div class="text-muted small mb-3">${exam.subject_name || ""}</div>
            <div class="small mb-1"><strong>Duration:</strong> ${exam.duration_minutes} minutes</div>
            <div class="small mb-3"><strong>Total Marks:</strong> ${exam.total_marks ?? ""}</div>
            <a class="btn btn-primary mt-auto" href="student-exam.html?exam_id=${exam.exam_id}">Start</a>
          </div>
        `;
        return col;
      }

      async function loadExams() {
        errorBox.classList.add("d-none");
        loading.classList.remove("d-none");
        list.innerHTML = "";

        try {
          const data = await window.Api.apiGet("/api/exams");
          const exams = data.exams || [];
          if (!exams.length) {
            loading.textContent = "No exams found.";
            return;
          }
          loading.classList.add("d-none");
          exams.forEach((e) => list.appendChild(examCard(e)));
        } catch (err) {
          loading.classList.add("d-none");
          showError(err.message);
        }
      }

      document.getElementById("refreshBtn").addEventListener("click", loadExams);
      loadExams();
    </script>
  </body>
</html>
