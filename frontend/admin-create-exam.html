<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create Exam</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="assets/css/styles.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
      <div class="container">
        <a class="navbar-brand" href="admin-dashboard.html">Admin</a>
        <div class="ms-auto d-flex align-items-center gap-2">
          <button id="logoutBtn" class="btn btn-sm btn-outline-secondary">Logout</button>
        </div>
      </div>
    </nav>

    <div class="container py-4">
      <div class="row justify-content-center">
        <div class="col-lg-7">
          <div class="card p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h4 class="mb-0">Create Exam</h4>
              <a class="btn btn-sm btn-outline-secondary" href="admin-dashboard.html">Back</a>
            </div>

            <div id="errorBox" class="alert alert-danger d-none"></div>
            <div id="successBox" class="alert alert-success d-none"></div>

            <form id="examForm">
              <div class="mb-3">
                <label class="form-label">Exam Title</label>
                <input id="examTitle" class="form-control" placeholder="DBMS Final" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Subject Name</label>
                <input id="subjectName" class="form-control" placeholder="Database Systems" />
              </div>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Duration (minutes)</label>
                  <input id="duration" type="number" class="form-control" value="30" min="1" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Total Marks</label>
                  <input id="totalMarks" type="number" class="form-control" value="20" min="1" required />
                </div>
              </div>
              <button class="btn btn-primary w-100 mt-3" type="submit">Create</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/storage.js"></script>
    <script>
      const admin = window.StorageUtil.getJson("admin");
      if (!admin) window.location.href = "admin-login.html";

      document.getElementById("logoutBtn").addEventListener("click", () => {
        window.Api.apiPost("/api/auth/admin/logout", {}).finally(() => {
          window.StorageUtil.clearKey("admin");
          window.location.href = "index.html";
        });
      });

      const errorBox = document.getElementById("errorBox");
      const successBox = document.getElementById("successBox");

      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.classList.remove("d-none");
      }
      function showSuccess(msg) {
        successBox.textContent = msg;
        successBox.classList.remove("d-none");
      }

      document.getElementById("examForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        errorBox.classList.add("d-none");
        successBox.classList.add("d-none");

        const exam_title = document.getElementById("examTitle").value;
        const subject_name = document.getElementById("subjectName").value;
        const duration_minutes = Number(document.getElementById("duration").value);
        const total_marks = Number(document.getElementById("totalMarks").value);

        try {
          const data = await window.Api.apiPost("/api/admin/exams", {
            exam_title,
            subject_name,
            duration_minutes,
            total_marks
          });
          showSuccess(`Exam created. New exam_id: ${data.exam_id}`);
        } catch (err) {
          showError(err.message);
        }
      });
    </script>
  </body>
</html>
