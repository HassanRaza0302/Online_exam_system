<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Student Profile</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="assets/css/styles.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
      <div class="container">
        <a class="navbar-brand" href="student-exams.html">Online Exam</a>
        <div class="ms-auto d-flex align-items-center gap-2">
          <span id="studentName" class="text-muted small"></span>
          <button id="logoutBtn" class="btn btn-sm btn-outline-secondary">Logout</button>
        </div>
      </div>
    </nav>

    <div class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Student Profile</h4>
        <a class="btn btn-sm btn-outline-primary" href="student-exams.html">Back</a>
      </div>

      <div id="errorBox" class="alert alert-danger d-none"></div>
      <div id="loading" class="text-muted">Loading profile...</div>

      <div id="content" class="d-none">
        <div class="row g-3 mb-3">
          <div class="col-md-4">
            <div class="card p-3">
              <div class="text-muted small">Status</div>
              <div id="statusVal" class="fs-5 fw-semibold"></div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card p-3">
              <div class="text-muted small">Attempts</div>
              <div id="attemptsVal" class="fs-5 fw-semibold"></div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card p-3">
              <div class="text-muted small">Submitted Exams</div>
              <div id="submittedVal" class="fs-5 fw-semibold"></div>
            </div>
          </div>
        </div>

        <div class="card p-3">
          <h6 class="mb-3">Exam History</h6>
          <div class="table-responsive">
            <table class="table table-striped table-bordered bg-white mb-0">
              <thead>
                <tr>
                  <th>Exam</th>
                  <th>Status</th>
                  <th>Score</th>
                  <th>%</th>
                  <th>Rank</th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/storage.js"></script>
    <script>
      const student = window.StorageUtil.getJson("student");
      if (!student) window.location.href = "student-login.html";

      document.getElementById("studentName").textContent = student.full_name;
      document.getElementById("logoutBtn").addEventListener("click", () => {
        window.Api.apiPost("/api/auth/student/logout", {}).finally(() => {
          window.StorageUtil.clearKey("student");
          window.location.href = "index.html";
        });
      });

      const errorBox = document.getElementById("errorBox");
      const loading = document.getElementById("loading");
      const content = document.getElementById("content");
      const rows = document.getElementById("rows");

      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.classList.remove("d-none");
      }

      async function loadProfile() {
        try {
          const data = await window.Api.apiGet("/api/profile/student");
          const s = data.student || {};
          const attempts = data.attempts || [];
          const submitted = attempts.filter((a) => a.status === "SUBMITTED");

          document.getElementById("statusVal").textContent = s.status || "-";
          document.getElementById("attemptsVal").textContent = attempts.length;
          document.getElementById("submittedVal").textContent = submitted.length;

          rows.innerHTML = "";
          attempts.forEach((a) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td>${a.exam_title}</td>
              <td>${a.status}</td>
              <td>${a.score ?? "-"}</td>
              <td>${a.percentage ?? "-"}</td>
              <td>${a.student_rank ?? "-"}</td>
            `;
            rows.appendChild(tr);
          });

          loading.classList.add("d-none");
          content.classList.remove("d-none");
        } catch (err) {
          loading.classList.add("d-none");
          showError(err.message);
        }
      }

      loadProfile();
    </script>
  </body>
</html>
