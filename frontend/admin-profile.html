<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Profile</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="assets/css/styles.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
      <div class="container">
        <a class="navbar-brand" href="admin-dashboard.html">Admin</a>
        <div class="ms-auto d-flex align-items-center gap-2">
          <span id="adminName" class="text-muted small"></span>
          <button id="logoutBtn" class="btn btn-sm btn-outline-secondary">Logout</button>
        </div>
      </div>
    </nav>

    <div class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Admin Profile</h4>
        <a class="btn btn-sm btn-outline-primary" href="admin-dashboard.html">Back</a>
      </div>

      <div id="errorBox" class="alert alert-danger d-none"></div>
      <div id="loading" class="text-muted">Loading profile...</div>

      <div id="content" class="d-none">
        <div class="row g-3 mb-3">
          <div class="col-md-3">
            <div class="card p-3">
              <div class="text-muted small">Created Exams</div>
              <div id="createdExamsVal" class="fs-5 fw-semibold"></div>
            </div>
          </div>
          <div class="col-md-3">
            <div class="card p-3">
              <div class="text-muted small">Pending Students</div>
              <div id="pendingVal" class="fs-5 fw-semibold"></div>
            </div>
          </div>
          <div class="col-md-3">
            <div class="card p-3">
              <div class="text-muted small">Approved Students</div>
              <div id="approvedVal" class="fs-5 fw-semibold"></div>
            </div>
          </div>
          <div class="col-md-3">
            <div class="card p-3">
              <div class="text-muted small">Total Students</div>
              <div id="totalVal" class="fs-5 fw-semibold"></div>
            </div>
          </div>
        </div>

        <div class="card p-3 mb-3">
          <h6 class="mb-3">All Students</h6>
          <div class="table-responsive">
            <table class="table table-striped table-bordered bg-white mb-0">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Status</th>
                  <th>Registered</th>
                </tr>
              </thead>
              <tbody id="studentRows"></tbody>
            </table>
          </div>
        </div>

        <div class="card p-3">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="mb-0">Created Exams</h6>
            <a class="btn btn-sm btn-outline-primary" href="admin-manage-exams.html">Manage</a>
          </div>
          <div class="table-responsive">
            <table class="table table-striped table-bordered bg-white mb-0">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Title</th>
                  <th>Subject</th>
                  <th>Time Limit</th>
                  <th>Total Marks</th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/storage.js"></script>
    <script>
      const admin = window.StorageUtil.getJson("admin");
      if (!admin) window.location.href = "admin-login.html";

      document.getElementById("adminName").textContent = admin.full_name || admin.email;
      document.getElementById("logoutBtn").addEventListener("click", () => {
        window.Api.apiPost("/api/auth/admin/logout", {}).finally(() => {
          window.StorageUtil.clearKey("admin");
          window.location.href = "index.html";
        });
      });

      const errorBox = document.getElementById("errorBox");
      const loading = document.getElementById("loading");
      const content = document.getElementById("content");
      const rows = document.getElementById("rows");
      const studentRows = document.getElementById("studentRows");

      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.classList.remove("d-none");
      }

      async function loadProfile() {
        try {
          const data = await window.Api.apiGet("/api/profile/admin");
          const exams = data.created_exams || [];
          const stats = data.student_stats || {};

          document.getElementById("createdExamsVal").textContent = exams.length;
          document.getElementById("pendingVal").textContent = stats.pending_students ?? 0;
          document.getElementById("approvedVal").textContent = stats.approved_students ?? 0;
          document.getElementById("totalVal").textContent = stats.total_students ?? 0;

          const students = data.students || [];
          studentRows.innerHTML = "";
          students.forEach((s) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td>${s.student_id}</td>
              <td>${s.full_name}</td>
              <td>${s.email}</td>
              <td>${s.status}</td>
              <td>${new Date(s.created_at).toLocaleString()}</td>
            `;
            studentRows.appendChild(tr);
          });

          rows.innerHTML = "";
          exams.forEach((e) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td>${e.exam_id}</td>
              <td>${e.exam_title}</td>
              <td>${e.subject_name || ""}</td>
              <td>${e.duration_minutes} min</td>
              <td>${e.total_marks}</td>
            `;
            rows.appendChild(tr);
          });

          loading.classList.add("d-none");
          content.classList.remove("d-none");
        } catch (err) {
          loading.classList.add("d-none");
          showError(err.message);
        }
      }

      loadProfile();
    </script>
  </body>
</html>
